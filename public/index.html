<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1530" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Orion AI Assistant</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #cccccc;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --bot-bg: #e5e7eb;
      --bot-text: #111111;
      --button: #2563eb;
      --button-text: #ffffff;
      --dot: #999999;
    }
    :root[data-theme="dark"] {
      --bg: #0b1220;
      --panel: #131c31;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #334155;
      --user-bg: #fb923c;
      --user-text: #1f1305;
      --bot-bg: #115e59;
      --bot-text: #f0fdfa;
      --button: #fb923c;
      --button-text: #1f1305;
      --dot: #5eead4;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
    #app { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; }
    #header { position: relative; text-align: center; }
    h1 { font-size: 22px; margin: 16px 0 8px; }

    /* Menu button (top-left) */
    #menu { position: absolute; left: 14px; top: 14px; width: 40px; height: 28px; border-radius: 14px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 16px; padding: 0; cursor: pointer; }

    /* Dark mode slider (top-right) */
    #theme { position: absolute; right: 14px; top: 14px; width: 52px; height: 28px; border-radius: 14px; border: 1px solid var(--border); background: var(--bot-bg); padding: 0; cursor: pointer; }
    #theme .knob { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--panel); display: flex; align-items: center; justify-content: center; font-size: 13px; transition: transform 0.25s; }
    :root[data-theme="dark"] #theme .knob { transform: translateX(24px); }

    #chat { flex: 1; overflow-y: auto; padding: 12px; }
    .bubble { padding: 12px; border-radius: 16px; margin: 6px 0; max-width: 80%; font-size: 16px; white-space: pre-wrap; }
    .user { background: var(--user-bg); color: var(--user-text); margin-left: auto; }
    .bot { background: none; color: var(--text); margin: 10px 0; margin-right: auto; max-width: 100%; padding: 6px 4px; }
    #typing { margin-left: 16px; color: var(--muted); height: 20px; font-size: 14px; }
    .dots { display: inline-flex; gap: 5px; align-items: center; height: 20px; }
    .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); animation: bounce 1.2s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }
    #row { display: flex; gap: 8px; padding: 10px; background: var(--panel); }
    /* The input bar: photo button, text box and microphone all sit inside one rounded bar */
    #bar { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; border: 1px solid var(--border); background: var(--bg); border-radius: 22px; padding: 0 6px; }
    #input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--text); padding: 11px 6px; font-size: 16px; }
    #attach, #mic { flex: none; width: 36px; height: 36px; border: none; background: none; color: var(--text); border-radius: 50%; font-size: 18px; padding: 0; cursor: pointer; }
    #attach, #mic { display: flex; align-items: center; justify-content: center; }
    #attach svg, #mic svg { width: 22px; height: 22px; display: block; }
    #mic.listening { background: #dc2626; color: #ffffff; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.5); }
      50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
    }
    #preview { display: none; align-items: center; gap: 10px; padding: 8px 12px 0; background: var(--panel); }
    #preview.show { display: flex; }
    #preview img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
    #preview button { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
    .bubble .pic { display: block; max-width: 100%; max-height: 240px; border-radius: 10px; margin-bottom: 6px; }
    .bubble .note { font-size: 13px; opacity: 0.8; margin-bottom: 4px; }
    #send { background: var(--button); color: var(--button-text); border: none; border-radius: 20px; padding: 0 18px; font-weight: bold; font-size: 16px; }


    .report { display: block; margin-top: 8px; background: none; border: none; color: inherit; opacity: 0.65; font-size: 12px; padding: 2px 0; cursor: pointer; }
    .report:disabled { opacity: 0.5; cursor: default; }
    .copy { display: block; margin-top: 8px; background: none; border: none; color: inherit; opacity: 0.65; font-size: 12px; padding: 2px 0; cursor: pointer; }

    /* Side panel with saved chats */
    #overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 10; }
    #overlay.show { opacity: 1; pointer-events: auto; }
    #drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(80vw, 300px); background: var(--panel); color: var(--text); border-right: 1px solid var(--border); transform: translateX(-100%); transition: transform 0.25s; z-index: 11; display: flex; flex-direction: column; padding: 12px; }
    #drawer.open { transform: translateX(0); }
    #drawer h2 { font-size: 18px; margin: 4px 4px 12px; }
    #drawerNew { background: var(--button); color: var(--button-text); border: none; border-radius: 12px; padding: 12px; font-size: 16px; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
    #list { flex: 1; overflow-y: auto; }
    .item { display: flex; align-items: center; gap: 8px; padding: 12px 10px; border-radius: 10px; cursor: pointer; }
    .item.active { background: var(--bot-bg); color: var(--bot-text); }
    .item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .item .del { background: none; border: none; color: inherit; opacity: 0.7; font-size: 16px; padding: 4px 8px; cursor: pointer; }
    .item .edit { background: none; border: none; color: inherit; opacity: 0.7; font-size: 15px; padding: 4px 6px; cursor: pointer; }
    .policy { display: block; margin-top: 10px; padding: 12px 10px; color: var(--muted); font-size: 14px; text-align: center; text-decoration: underline; }
    #policyView { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; flex-direction: column; }
    #policyView.show { display: flex; }
    #policyBar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); color: var(--text); border-bottom: 1px solid var(--border); font-weight: bold; }
    #policyBack { width: 40px; height: 32px; border-radius: 16px; border: 1px solid var(--border); background: none; color: var(--text); font-size: 18px; padding: 0; cursor: pointer; }
    #policyFrame { flex: 1; width: 100%; border: 0; background: var(--bg); }
    .bubble .md { white-space: normal; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: 6px 0; }
    .md h4 { margin: 10px 0 4px; font-size: 16px; }
    .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
    .md li { margin: 3px 0; }
    .md pre { margin: 8px 0; padding: 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.25); overflow-x: auto; white-space: pre; font-size: 13px; }
    .md code { font-family: monospace; font-size: 0.92em; background: rgba(127, 127, 127, 0.25); padding: 1px 5px; border-radius: 4px; }
    .md pre code { background: none; padding: 0; }
    .md a { color: inherit; text-decoration: underline; }
    .empty { color: var(--muted); padding: 12px 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <button id="menu" aria-label="Saved chats">☰</button>
      <h1>Orion</h1>
      <button id="theme" role="switch" aria-label="Dark mode" aria-checked="false"><span class="knob">☀️</span></button>
    </div>
    <div id="chat"></div>
    <div id="typing"></div>
    <div id="preview"></div>
    <div id="row">
      <div id="bar">
        <button id="attach" aria-label="Add a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <input id="input" placeholder="Type a message..." autocomplete="off" />
        <button id="mic" aria-label="Voice input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      </div>
      <button id="send">Send</button>
    </div>
    <input id="file" type="file" accept="image/*" hidden />
  </div>

  <div id="overlay"></div>
  <div id="drawer">
    <h2>Your chats</h2>
    <button id="drawerNew">+ New chat</button>
    <div id="list"></div>
    <a class="policy" id="policyLink" href="/privacy.html">Privacy policy</a>
  </div>

  <div id="policyView">
    <div id="policyBar"><button id="policyBack" aria-label="Back">←</button><span>Privacy policy</span></div>
    <iframe id="policyFrame" title="Privacy policy"></iframe>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const typing = document.getElementById("typing");
    const themeBtn = document.getElementById("theme");
    const menuBtn = document.getElementById("menu");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    const list = document.getElementById("list");

    const waiting = new Set();   // chats that are waiting for a reply right now
    let recognition = null;
    let listening = false;

    // ----- Dark mode -----
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeBtn.querySelector(".knob").textContent = theme === "dark" ? "🌙" : "☀️";
      themeBtn.setAttribute("aria-checked", theme === "dark" ? "true" : "false");
      const color = theme === "dark" ? "#0b1220" : "#0b1530";
      document.querySelector('meta[name="theme-color"]').setAttribute("content", color);
    }

    function loadTheme() {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved === "dark" || saved === "light") return saved;
      // No saved choice: follow the phone's own setting
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    themeBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });

    applyTheme(loadTheme());

    // ----- Copy one reply -----
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        try {   // fallback for browsers that block the clipboard API
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (e2) { return false; }
      }
    }

    // ----- Chat bubbles -----
    // "msg" is the stored message (it can hold a photo).
    // "question" is only given for real bot replies, which are the ones that get a Report button.
    function addBubble(text, role, msg, question) {
      const div = document.createElement("div");
      div.className = "bubble " + (role === "user" ? "user" : "bot");

      if (msg && msg.image) {
        const pic = document.createElement("img");
        pic.className = "pic";
        pic.alt = "Your photo";
        pic.onload = () => { chat.scrollTop = chat.scrollHeight; };
        pic.src = msg.image;
        div.appendChild(pic);
      } else if (msg && msg.hadImage) {
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = "📷 Photo (not saved)";
        div.appendChild(note);
      }

      if (text) {
        const words = document.createElement("div");
        if (role !== "user" && question !== undefined) {
          words.className = "md";
          renderMarkdown(text, words);
        } else {
          words.textContent = text;
        }
        div.appendChild(words);
      }

      if (role !== "user" && question !== undefined) {
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy";
        copyBtn.textContent = "📋 Copy";
        copyBtn.addEventListener("click", async () => {
          copyBtn.textContent = (await copyText(text)) ? "✓ Copied" : "Could not copy";   // copies only this reply, not your question
          setTimeout(() => { copyBtn.textContent = "📋 Copy"; }, 1500);
        });
        div.appendChild(copyBtn);

        const btn = document.createElement("button");
        btn.className = "report";
        btn.textContent = "🚩 Report";
        btn.addEventListener("click", async () => {
          const reason = prompt("What was wrong with this reply? (you can leave this empty)");
          if (reason === null) return;   // cancelled
          btn.disabled = true;
          btn.textContent = "Sending...";
          try {
            const r = await fetch("/report", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ reply: text, question: question, reason: reason }),
            });
            if (!r.ok) throw new Error("failed");
            btn.textContent = "✓ Reported, thank you";
          } catch (e) {
            btn.disabled = false;
            btn.textContent = "Could not send, tap to try again";
          }
        });
        div.appendChild(btn);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // ----- Formatting for bot replies (bold, italic, code, lists, headings, links) -----
    // Everything is built from text nodes, so nothing the bot writes can run as code.
    function addInline(parent, text) {
      const pattern = /(`[^`\n]+`)|(\*\*[^*\n]+?\*\*)|(\*[^*\s][^*\n]*?\*)|(\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\))/g;
      let last = 0;
      let m;
      while ((m = pattern.exec(text)) !== null) {
        if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
        if (m[1]) {
          const code = document.createElement("code");
          code.textContent = m[1].slice(1, -1);
          parent.appendChild(code);
        } else if (m[2]) {
          const strong = document.createElement("strong");
          addInline(strong, m[2].slice(2, -2));
          parent.appendChild(strong);
        } else if (m[3]) {
          const em = document.createElement("em");
          addInline(em, m[3].slice(1, -1));
          parent.appendChild(em);
        } else if (m[4]) {
          const a = document.createElement("a");
          a.href = m[6];                       // only http(s) links are matched
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = m[5];
          parent.appendChild(a);
        }
        last = pattern.lastIndex;
      }
      if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
    }

    function renderMarkdown(text, container) {
      const lines = text.replace(/\r\n/g, "\n").split("\n");
      const listLine = /^\s*([-*•]|\d+[.)])\s+(.*)$/;
      let para = [];
      let i = 0;

      function flushPara() {
        if (!para.length) return;
        const p = document.createElement("p");
        para.forEach((ln, idx) => {
          if (idx > 0) p.appendChild(document.createElement("br"));
          addInline(p, ln);
        });
        container.appendChild(p);
        para = [];
      }

      while (i < lines.length) {
        const line = lines[i];

        if (/^\s*```/.test(line)) {                       // code block
          flushPara();
          const code = [];
          i++;
          while (i < lines.length && !/^\s*```/.test(lines[i])) { code.push(lines[i]); i++; }
          i++;                                            // skip the closing fence
          const pre = document.createElement("pre");
          const c = document.createElement("code");
          c.textContent = code.join("\n");
          pre.appendChild(c);
          container.appendChild(pre);
          continue;
        }

        let m = /^\s{0,3}#{1,6}\s+(.*)$/.exec(line);      // heading
        if (m) {
          flushPara();
          const h = document.createElement("h4");
          addInline(h, m[1]);
          container.appendChild(h);
          i++;
          continue;
        }

        m = listLine.exec(line);                          // bullet or numbered list
        if (m) {
          flushPara();
          const ordered = /\d/.test(m[1]);
          const list = document.createElement(ordered ? "ol" : "ul");
          while (i < lines.length) {
            const mm = listLine.exec(lines[i]);
            if (!mm || /\d/.test(mm[1]) !== ordered) break;
            const li = document.createElement("li");
            addInline(li, mm[2]);
            list.appendChild(li);
            i++;
          }
          container.appendChild(list);
          continue;
        }

        if (line.trim() === "") { flushPara(); i++; continue; }
        para.push(line);
        i++;
      }
      flushPara();
    }

    // ----- Saved chats -----
    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function newChat() {
      return { id: newId(), title: "New chat", messages: [], updated: Date.now() };
    }

    function makeTitle(messages) {
      const first = messages.find((m) => m.role === "user");
      const text = first ? (first.content.trim() || "📷 Photo") : "New chat";
      return text.length > 30 ? text.slice(0, 30) + "…" : text;
    }

    function loadChats() {
      try {
        const saved = JSON.parse(localStorage.getItem("chats") || "null");
        if (Array.isArray(saved)) return saved;
      } catch (e) {}
      // Bring over the single chat saved by the earlier version of the app
      try {
        const old = JSON.parse(localStorage.getItem("chat") || "[]");
        if (Array.isArray(old) && old.length) {
          const first = newChat();
          first.messages = old;
          first.title = makeTitle(old);
          return [first];
        }
      } catch (e) {}
      return [];
    }

    function saveChats() {
      // photos are too big to store, so only a note that a photo was sent is saved
      const slim = chats.map((c) => ({
        ...c,
        messages: c.messages.map((m) =>
          m.image ? { role: m.role, content: m.content, hadImage: true } : m
        ),
      }));
      try { localStorage.setItem("chats", JSON.stringify(slim)); } catch (e) {}
    }

    // Remembers the open chat only until the app is fully closed
    function rememberCurrent() {
      try { sessionStorage.setItem("currentId", current.id); } catch (e) {}
    }

    let chats = loadChats();
    chats.sort((a, b) => b.updated - a.updated);
    let current = null;
    try {
      const id = sessionStorage.getItem("currentId");
      current = chats.find((c) => c.id === id) || null;   // same session: keep your chat
    } catch (e) {}
    if (!current) current = newChat();                    // app was closed: start a new chat
    rememberCurrent();

    function updateTyping() {
      typing.innerHTML = waiting.has(current)
        ? '<span class="dots"><span></span><span></span><span></span></span>'
        : "";
    }

    function renderChat() {
      chat.innerHTML = "";
      current.messages.forEach((m, i) =>
        addBubble(m.content, m.role, m, m.role === "user" ? undefined : (i > 0 ? current.messages[i - 1].content : ""))
      );
      updateTyping();
    }

    function renderList() {
      list.innerHTML = "";
      const sorted = [...chats].sort((a, b) => b.updated - a.updated);
      if (sorted.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No saved chats yet.";
        list.appendChild(empty);
        return;
      }
      sorted.forEach((c) => {
        const row = document.createElement("div");
        row.className = "item" + (c === current ? " active" : "");

        const title = document.createElement("span");
        title.className = "title";
        title.textContent = c.title;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.setAttribute("aria-label", "Delete chat");
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteChat(c);
        });

        const edit = document.createElement("button");
        edit.className = "edit";
        edit.textContent = "✏️";
        edit.setAttribute("aria-label", "Rename chat");
        edit.addEventListener("click", (e) => {
          e.stopPropagation();
          renameChat(c);
        });

        row.addEventListener("click", () => openChat(c));
        row.appendChild(title);
        row.appendChild(edit);
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    function openDrawer() {
      renderList();
      drawer.classList.add("open");
      overlay.classList.add("show");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      overlay.classList.remove("show");
    }

    function openChat(c) {
      current = c;
      rememberCurrent();
      renderChat();
      closeDrawer();
    }

    function startNewChat() {
      current = newChat();
      rememberCurrent();
      renderChat();
      closeDrawer();
    }

    function renameChat(c) {
      const name = prompt("Rename chat:", c.title);
      if (name === null) return;          // cancelled
      const clean = name.trim();
      if (!clean) return;                 // empty name: keep the old one
      c.title = clean.slice(0, 40);
      c.custom = true;                    // stop the title from being auto-changed
      saveChats();
      renderList();
    }

    function deleteChat(c) {
      if (!confirm("Delete this chat?")) return;
      chats = chats.filter((x) => x !== c);
      saveChats();
      if (current === c) {
        current = newChat();
        rememberCurrent();
        renderChat();
      }
      renderList();
    }

    menuBtn.addEventListener("click", openDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.getElementById("drawerNew").addEventListener("click", startNewChat);

    renderChat();
    saveChats();

    // ----- Photos -----
    const previewBox = document.getElementById("preview");
    const fileInput = document.getElementById("file");
    const attachBtn = document.getElementById("attach");
    let pendingImage = null;

    // Shrinks the photo so it uploads quickly
    function readImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const scale = Math.min(1, 1024 / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";   // transparent PNGs get a white background
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/jpeg", 0.8));
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Could not read image"));
        };
        img.src = url;
      });
    }

    function setPending(dataUrl) {
      pendingImage = dataUrl;
      previewBox.innerHTML = "";
      const thumb = document.createElement("img");
      thumb.src = dataUrl;
      thumb.alt = "Selected photo";
      const remove = document.createElement("button");
      remove.textContent = "✕";
      remove.setAttribute("aria-label", "Remove photo");
      remove.addEventListener("click", clearPending);
      previewBox.appendChild(thumb);
      previewBox.appendChild(remove);
      previewBox.classList.add("show");
    }

    function clearPending() {
      pendingImage = null;
      previewBox.innerHTML = "";
      previewBox.classList.remove("show");
    }

    // Only the 3 newest photos are sent with each question, to keep requests small
    function buildPayload(messages) {
      let keep = 3;
      const out = [];
      for (let i = messages.length - 1; i >= 0; i--) {
        const m = messages[i];
        const item = { role: m.role, content: m.content };
        if (m.image) {
          if (keep > 0) {
            item.image = m.image;
            keep--;
          } else {
            item.content = "(an earlier photo is no longer available) " + m.content;
          }
        } else if (m.hadImage) {
          item.content = "(a photo was sent here but is no longer available) " + m.content;
        }
        out.unshift(item);
      }
      return out;
    }

    attachBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      fileInput.value = "";   // lets you pick the same photo again later
      if (!file) return;
      try {
        setPending(await readImage(file));
      } catch (e) {
        alert("Sorry, I couldn't read that photo. Try a JPG or PNG.");
      }
    });

    // ----- Voice input -----
    const micBtn = document.getElementById("mic");
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      micBtn.style.display = "none";   // this browser can't do speech recognition
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = navigator.language || "en-US";   // follows your phone's language
      recognition.interimResults = true;
      recognition.continuous = false;

      let baseText = "";

      recognition.onstart = () => {
        listening = true;
        micBtn.classList.add("listening");
      };

      recognition.onend = () => {
        listening = false;
        micBtn.classList.remove("listening");
      };

      recognition.onerror = (event) => {
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          alert("Microphone is blocked. Allow it in your browser's site settings.");
        }
      };

      recognition.onresult = (event) => {
        let spoken = "";
        for (let i = 0; i < event.results.length; i++) {
          spoken += event.results[i][0].transcript;
        }
        input.value = (baseText + " " + spoken).replace(/\s+/g, " ").trim();   // tidy extra spaces
      };

      micBtn.addEventListener("click", () => {
        if (listening) {
          recognition.stop();
          return;
        }
        baseText = input.value.trim();
        try { recognition.start(); } catch (e) {}
      });
    }

    // ----- Privacy policy (opens inside the app, so there is no browser bar) -----
    const policyView = document.getElementById("policyView");
    const policyFrame = document.getElementById("policyFrame");

    function openPolicy() {
      if (!policyFrame.getAttribute("src")) policyFrame.src = "/privacy.html";
      policyView.classList.add("show");
      closeDrawer();
      history.pushState({ policy: true }, "");   // so the phone's Back button closes it
    }

    function closePolicy() {
      policyView.classList.remove("show");
    }

    document.getElementById("policyLink").addEventListener("click", (e) => {
      e.preventDefault();
      openPolicy();
    });
    document.getElementById("policyBack").addEventListener("click", () => {
      if (history.state && history.state.policy) history.back();
      else closePolicy();
    });
    window.addEventListener("popstate", closePolicy);

    // ----- Sending messages -----
    async function sendMessage() {
      const text = input.value.trim();
      if ((!text && !pendingImage) || waiting.has(current)) return;
      if (recognition && listening) recognition.abort();

      const target = current;   // the chat this message belongs to
      const userMsg = { role: "user", content: text };
      if (pendingImage) userMsg.image = pendingImage;
      target.messages.push(userMsg);
      if (!chats.includes(target)) chats.push(target);
      if (!target.custom) target.title = makeTitle(target.messages);
      target.updated = Date.now();
      saveChats();

      addBubble(text, "user", userMsg);
      input.value = "";
      clearPending();
      waiting.add(target);
      updateTyping();

      let failText = "Sorry, something went wrong.";
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: buildPayload(target.messages) }),
          signal: AbortSignal.timeout ? AbortSignal.timeout(120000) : undefined,
        });
        const data = await response.json();
        if (!data.reply) {
          if (data.message) failText = data.message;   // for example: daily limit reached
          throw new Error("No reply");
        }

        target.messages.push({ role: "assistant", content: data.reply });
        target.updated = Date.now();
        saveChats();
        if (current === target) addBubble(data.reply, "assistant", null, text);
      } catch (error) {
        if (error && error.name === "TimeoutError") {
          failText = "The server is taking too long. It may be waking up, so please try again in a minute.";
        }
        if (current === target) addBubble(failText, "assistant");
      }

      waiting.delete(target);
      updateTyping();
    }

    // lets the app show a friendly page when you are offline
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
