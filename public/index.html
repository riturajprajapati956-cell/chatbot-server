<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1530" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>My AI Chatbot</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #cccccc;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --bot-bg: #e5e7eb;
      --bot-text: #111111;
      --button: #2563eb;
      --button-text: #ffffff;
      --dot: #999999;
    }
    :root[data-theme="dark"] {
      --bg: #0b1220;
      --panel: #131c31;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #334155;
      --user-bg: #fb923c;
      --user-text: #1f1305;
      --bot-bg: #115e59;
      --bot-text: #f0fdfa;
      --button: #fb923c;
      --button-text: #1f1305;
      --dot: #5eead4;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
    #app { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; }
    #header { position: relative; text-align: center; }
    h1 { font-size: 22px; margin: 16px 0 8px; }

    /* Menu button (top-left) */
    #menu { position: absolute; left: 14px; top: 14px; width: 40px; height: 28px; border-radius: 14px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 16px; padding: 0; cursor: pointer; }

    /* Dark mode slider (top-right) */
    #theme { position: absolute; right: 14px; top: 14px; width: 52px; height: 28px; border-radius: 14px; border: 1px solid var(--border); background: var(--bot-bg); padding: 0; cursor: pointer; }
    #theme .knob { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--panel); display: flex; align-items: center; justify-content: center; font-size: 13px; transition: transform 0.25s; }
    :root[data-theme="dark"] #theme .knob { transform: translateX(24px); }

    #chat { flex: 1; overflow-y: auto; padding: 12px; }
    .bubble { padding: 12px; border-radius: 16px; margin: 6px 0; max-width: 80%; font-size: 16px; white-space: pre-wrap; }
    .user { background: var(--user-bg); color: var(--user-text); margin-left: auto; }
    .bot { background: var(--bot-bg); color: var(--bot-text); margin-right: auto; }
    #typing { margin-left: 16px; color: var(--muted); height: 20px; font-size: 14px; }
    .dots { display: inline-flex; gap: 5px; align-items: center; height: 20px; }
    .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); animation: bounce 1.2s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }
    #row { display: flex; gap: 8px; padding: 10px; background: var(--panel); }
    #input { flex: 1; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 20px; padding: 10px 14px; font-size: 16px; }
    #send { background: var(--button); color: var(--button-text); border: none; border-radius: 20px; padding: 0 18px; font-weight: bold; font-size: 16px; }


    /* Twinkling stars (dark mode only) */
    #stars { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; display: none; }
    :root[data-theme="dark"] #stars { display: block; }
    #app { position: relative; z-index: 1; }

    /* Side panel with saved chats */
    #overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 10; }
    #overlay.show { opacity: 1; pointer-events: auto; }
    #drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(80vw, 300px); background: var(--panel); color: var(--text); border-right: 1px solid var(--border); transform: translateX(-100%); transition: transform 0.25s; z-index: 11; display: flex; flex-direction: column; padding: 12px; }
    #drawer.open { transform: translateX(0); }
    #drawer h2 { font-size: 18px; margin: 4px 4px 12px; }
    #drawerNew { background: var(--button); color: var(--button-text); border: none; border-radius: 12px; padding: 12px; font-size: 16px; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
    #list { flex: 1; overflow-y: auto; }
    .item { display: flex; align-items: center; gap: 8px; padding: 12px 10px; border-radius: 10px; cursor: pointer; }
    .item.active { background: var(--bot-bg); color: var(--bot-text); }
    .item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .item .del { background: none; border: none; color: inherit; opacity: 0.7; font-size: 16px; padding: 4px 8px; cursor: pointer; }
    .item .edit { background: none; border: none; color: inherit; opacity: 0.7; font-size: 15px; padding: 4px 6px; cursor: pointer; }
    .empty { color: var(--muted); padding: 12px 10px; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div id="app">
    <div id="header">
      <button id="menu" aria-label="Saved chats">☰</button>
      <h1>My AI Chatbot</h1>
      <button id="theme" role="switch" aria-label="Dark mode" aria-checked="false"><span class="knob">☀️</span></button>
    </div>
    <div id="chat"></div>
    <div id="typing"></div>
    <div id="row">
      <input id="input" placeholder="Type a message..." autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>

  <div id="overlay"></div>
  <div id="drawer">
    <h2>Your chats</h2>
    <button id="drawerNew">+ New chat</button>
    <div id="list"></div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const typing = document.getElementById("typing");
    const themeBtn = document.getElementById("theme");
    const menuBtn = document.getElementById("menu");
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    const list = document.getElementById("list");

    let loading = false;

    // ----- Twinkling stars (dark mode only) -----
    const starCanvas = document.getElementById("stars");
    const starCtx = starCanvas.getContext("2d");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let starList = [];
    let starsOn = false;
    let starTimer = null;
    let lastDraw = 0;
    let starW = 0;
    let starH = 0;

    function makeStars() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      starW = window.innerWidth;
      starH = window.innerHeight;
      starCanvas.width = starW * dpr;
      starCanvas.height = starH * dpr;
      starCanvas.style.width = starW + "px";
      starCanvas.style.height = starH + "px";
      starCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = Math.max(40, Math.min(120, Math.round((starW * starH) / 7000)));
      starList = [];
      // split the screen into equal cells and put one star in each, so no side looks emptier
      // an even number of columns, so the left and right halves get the same number of stars
      const cols = Math.max(2, 2 * Math.round(Math.sqrt((count * starW) / starH) / 2));
      const rows = Math.max(1, Math.round(count / cols));
      const cellW = starW / cols;
      const cellH = starH / rows;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = (col + Math.random()) * cellW;
          const y = (row + Math.random()) * cellH;
          starList.push({
            x: x,
            y: y,
            r: 0.5 + Math.random() * 1.3,
            phase: Math.random() * Math.PI * 2,
            speed: 0.6 + Math.random() * 1.6,
          });
        }
      }
      layoutOrion();
    }

    // Orion: positions on a 0-1 square, same shape as your app icon
    const ORION = [
      { x: 0.50, y: 0.22, r: 3, c: [235, 240, 255] },   // 0 Meissa (head)
      { x: 0.32, y: 0.28, r: 8, c: [255, 170, 110] },   // 1 Betelgeuse (orange shoulder)
      { x: 0.70, y: 0.30, r: 5, c: [200, 220, 255] },   // 2 Bellatrix
      { x: 0.41, y: 0.52, r: 5, c: [225, 235, 255] },   // 3 Alnitak (belt)
      { x: 0.50, y: 0.50, r: 5, c: [225, 235, 255] },   // 4 Alnilam (belt)
      { x: 0.59, y: 0.48, r: 5, c: [225, 235, 255] },   // 5 Mintaka (belt)
      { x: 0.34, y: 0.76, r: 5, c: [200, 220, 255] },   // 6 Saiph
      { x: 0.68, y: 0.74, r: 8, c: [180, 205, 255] },   // 7 Rigel
    ];
    const ORION_LINES = [[0, 1], [0, 2], [1, 3], [2, 5], [3, 4], [4, 5], [3, 6], [5, 7]];
    // Easy to tweak: 1 = old size / old brightness, smaller numbers = smaller / dimmer
    const ORION_SIZE = 0.6;
    const ORION_BRIGHTNESS = 0.7;
    let orionPts = [];
    let orionLine = 1;

    function layoutOrion() {
      // big, and centered on the screen
      const S = ORION_SIZE * Math.min(2.1 * starW, 1.48 * starH);
      const ox = starW / 2 - 0.51 * S;
      const oy = starH / 2 - 0.49 * S;
      orionPts = ORION.map((o) => ({
        x: ox + o.x * S,
        y: oy + o.y * S,
        rad: Math.max(1.5, S * o.r * 0.0019),
      }));
      orionLine = Math.max(1, S * 0.0025);
    }

    function drawOrion(t) {
      // faint lines between the stars
      starCtx.globalAlpha = 1;
      starCtx.lineWidth = orionLine;
      starCtx.strokeStyle = "rgba(120, 150, 210, " + 0.3 * ORION_BRIGHTNESS + ")";
      for (const [a, b] of ORION_LINES) {
        starCtx.beginPath();
        starCtx.moveTo(orionPts[a].x, orionPts[a].y);
        starCtx.lineTo(orionPts[b].x, orionPts[b].y);
        starCtx.stroke();
      }
      // glowing stars that twinkle gently
      for (let i = 0; i < orionPts.length; i++) {
        const p = orionPts[i];
        const [r, g, b] = ORION[i].c;
        const tw = reduceMotion ? 0.85 : 0.7 + 0.3 * Math.sin((t / 1000) * 0.8 + i * 1.7);
        const glow = p.rad * 4;
        const grad = starCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glow);
        grad.addColorStop(0, "rgba(" + r + "," + g + "," + b + "," + 0.45 * tw * ORION_BRIGHTNESS + ")");
        grad.addColorStop(1, "rgba(" + r + "," + g + "," + b + ",0)");
        starCtx.fillStyle = grad;
        starCtx.beginPath();
        starCtx.arc(p.x, p.y, glow, 0, Math.PI * 2);
        starCtx.fill();
        starCtx.fillStyle = "rgba(" + r + "," + g + "," + b + "," + tw * ORION_BRIGHTNESS + ")";
        starCtx.beginPath();
        starCtx.arc(p.x, p.y, p.rad, 0, Math.PI * 2);
        starCtx.fill();
      }
    }

    function drawStars(t) {
      starCtx.clearRect(0, 0, starW, starH);
      starCtx.fillStyle = "#dbe7ff";
      for (const s of starList) {
        // each star fades in and out at its own speed
        starCtx.globalAlpha = reduceMotion
          ? 0.5
          : 0.2 + 0.7 * (0.5 + 0.5 * Math.sin((t / 1000) * s.speed + s.phase));
        starCtx.beginPath();
        starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        starCtx.fill();
      }
      drawOrion(t);
      starCtx.globalAlpha = 1;
    }

    function starLoop(t) {
      starTimer = null;
      if (!starsOn || document.hidden) return;
      if (t - lastDraw > 50) {          // about 20 frames a second saves battery
        drawStars(t);
        lastDraw = t;
      }
      starTimer = requestAnimationFrame(starLoop);
    }

    function startLoop() {
      if (starTimer === null) starTimer = requestAnimationFrame(starLoop);
    }

    function setStars(on) {
      if (on === starsOn) return;
      starsOn = on;
      if (!on) return;
      if (starList.length === 0) makeStars();
      if (reduceMotion) drawStars(0);
      else startLoop();
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && starsOn && !reduceMotion) startLoop();
    });

    window.addEventListener("resize", () => {
      // rebuild only if the screen got wider or taller (not when the keyboard opens)
      if (window.innerWidth !== starW || window.innerHeight > starH) {
        makeStars();
        if (starsOn) drawStars(performance.now());
      }
    });

    // ----- Dark mode -----
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      setStars(theme === "dark");
      themeBtn.querySelector(".knob").textContent = theme === "dark" ? "🌙" : "☀️";
      themeBtn.setAttribute("aria-checked", theme === "dark" ? "true" : "false");
      const color = theme === "dark" ? "#0b1220" : "#0b1530";
      document.querySelector('meta[name="theme-color"]').setAttribute("content", color);
    }

    function loadTheme() {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved === "dark" || saved === "light") return saved;
      // No saved choice: follow the phone's own setting
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    themeBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });

    applyTheme(loadTheme());

    // ----- Chat bubbles -----
    function addBubble(text, role) {
      const div = document.createElement("div");
      div.className = "bubble " + (role === "user" ? "user" : "bot");
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // ----- Saved chats -----
    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function newChat() {
      return { id: newId(), title: "New chat", messages: [], updated: Date.now() };
    }

    function makeTitle(messages) {
      const first = messages.find((m) => m.role === "user");
      const text = first ? first.content.trim() : "New chat";
      return text.length > 30 ? text.slice(0, 30) + "…" : text;
    }

    function loadChats() {
      try {
        const saved = JSON.parse(localStorage.getItem("chats") || "null");
        if (Array.isArray(saved)) return saved;
      } catch (e) {}
      // Bring over the single chat saved by the earlier version of the app
      try {
        const old = JSON.parse(localStorage.getItem("chat") || "[]");
        if (Array.isArray(old) && old.length) {
          const first = newChat();
          first.messages = old;
          first.title = makeTitle(old);
          return [first];
        }
      } catch (e) {}
      return [];
    }

    function saveChats() {
      try { localStorage.setItem("chats", JSON.stringify(chats)); } catch (e) {}
    }

    // Remembers the open chat only until the app is fully closed
    function rememberCurrent() {
      try { sessionStorage.setItem("currentId", current.id); } catch (e) {}
    }

    let chats = loadChats();
    chats.sort((a, b) => b.updated - a.updated);
    let current = null;
    try {
      const id = sessionStorage.getItem("currentId");
      current = chats.find((c) => c.id === id) || null;   // same session: keep your chat
    } catch (e) {}
    if (!current) current = newChat();                    // app was closed: start a new chat
    rememberCurrent();

    function renderChat() {
      chat.innerHTML = "";
      current.messages.forEach((m) => addBubble(m.content, m.role));
    }

    function renderList() {
      list.innerHTML = "";
      const sorted = [...chats].sort((a, b) => b.updated - a.updated);
      if (sorted.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No saved chats yet.";
        list.appendChild(empty);
        return;
      }
      sorted.forEach((c) => {
        const row = document.createElement("div");
        row.className = "item" + (c === current ? " active" : "");

        const title = document.createElement("span");
        title.className = "title";
        title.textContent = c.title;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.setAttribute("aria-label", "Delete chat");
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteChat(c);
        });

        const edit = document.createElement("button");
        edit.className = "edit";
        edit.textContent = "✏️";
        edit.setAttribute("aria-label", "Rename chat");
        edit.addEventListener("click", (e) => {
          e.stopPropagation();
          renameChat(c);
        });

        row.addEventListener("click", () => openChat(c));
        row.appendChild(title);
        row.appendChild(edit);
        row.appendChild(del);
        list.appendChild(row);
      });
    }

    function openDrawer() {
      renderList();
      drawer.classList.add("open");
      overlay.classList.add("show");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      overlay.classList.remove("show");
    }

    function openChat(c) {
      current = c;
      rememberCurrent();
      renderChat();
      closeDrawer();
    }

    function startNewChat() {
      current = newChat();
      rememberCurrent();
      renderChat();
      closeDrawer();
    }

    function renameChat(c) {
      const name = prompt("Rename chat:", c.title);
      if (name === null) return;          // cancelled
      const clean = name.trim();
      if (!clean) return;                 // empty name: keep the old one
      c.title = clean.slice(0, 40);
      c.custom = true;                    // stop the title from being auto-changed
      saveChats();
      renderList();
    }

    function deleteChat(c) {
      if (!confirm("Delete this chat?")) return;
      chats = chats.filter((x) => x !== c);
      saveChats();
      if (current === c) {
        current = newChat();
        rememberCurrent();
        renderChat();
      }
      renderList();
    }

    menuBtn.addEventListener("click", openDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.getElementById("drawerNew").addEventListener("click", startNewChat);

    renderChat();
    saveChats();

    // ----- Sending messages -----
    async function sendMessage() {
      const text = input.value.trim();
      if (!text || loading) return;

      const target = current;   // the chat this message belongs to
      target.messages.push({ role: "user", content: text });
      if (!chats.includes(target)) chats.push(target);
      if (!target.custom) target.title = makeTitle(target.messages);
      target.updated = Date.now();
      saveChats();

      addBubble(text, "user");
      input.value = "";
      loading = true;
      typing.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: target.messages }),
        });
        const data = await response.json();
        if (!data.reply) throw new Error("No reply");

        target.messages.push({ role: "assistant", content: data.reply });
        target.updated = Date.now();
        saveChats();
        if (current === target) addBubble(data.reply, "assistant");
      } catch (error) {
        if (current === target) addBubble("Sorry, something went wrong.", "assistant");
      }

      loading = false;
      typing.textContent = "";
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
