<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orion – offline</title>
  <style>
    :root { --bg: #f5f5f5; --text: #111111; --muted: #555555; --btn: #2563eb; --btn-text: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --text: #e5e7eb; --muted: #94a3b8; --btn: #fb923c; --btn-text: #1f1305; } }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: var(--bg); color: var(--text); font-family: sans-serif; }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 0; color: var(--muted); font-size: 16px; }
    button { margin-top: 8px; padding: 12px 24px; border: 0; border-radius: 22px; background: var(--btn); color: var(--btn-text); font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>You’re offline</h1>
  <p>Orion needs an internet connection. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
